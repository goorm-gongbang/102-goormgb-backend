services:
  local-postgres:
    image: postgres:16
    container_name: goormgb-postgres
    environment:
      POSTGRES_DB: goormgb
      POSTGRES_USER: goormgb
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    platform: linux/arm64
    networks:
      - goormgb-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U goormgb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1. 기존 캐시용 레디스 (6379)
  local-redis:
    image: redis:7
    container_name: goormgb-redis
    ports:
      - "6379:6379"
    platform: linux/arm64
    networks:
      - goormgb-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # 2. 추가된 큐 전용 레디스 (6380)
  queue-redis:
    image: redis:7
    container_name: goormgb-redis-queue
    ports:
      - "6380:6379" # 외부 포트만 6380으로 매핑
    platform: linux/arm64
    networks:
      - goormgb-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: goormgb-kafka
    ports:
      - "9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafka-data:/var/lib/kafka/data
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    networks:
      - goormgb-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: ..
      dockerfile: API-Gateway/Dockerfile
      args:
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/arm64}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
    container_name: api-gateway
    environment:
      AUTH_GUARD_URL: http://auth-guard:8080
      QUEUE_URL: http://queue:8081
      SEAT_URL: http://seat:8082
      ORDER_CORE_URL: http://order-core:8083
      REDIS_HOST: local-redis
      REDIS_PORT: 6379
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_AUDIENCE: ${JWT_ACCESS_TOKEN_AUDIENCE}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8085:8085"
    depends_on:
      local-redis:
        condition: service_healthy
    networks:
      - goormgb-network

  auth-guard:
    build:
      context: ..
      dockerfile: Auth-Guard/Dockerfile
      args:
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/arm64}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
    container_name: auth-guard
    environment:
      DB_URL: jdbc:postgresql://local-postgres:5432/goormgb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: local-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PRODUCER_KEY_SERIALIZER: ${KAFKA_PRODUCER_KEY_SERIALIZER}
      KAFKA_PRODUCER_VALUE_SERIALIZER: ${KAFKA_PRODUCER_VALUE_SERIALIZER}
      KAFKA_PRODUCER_ACKS: ${KAFKA_PRODUCER_ACKS}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_AUDIENCE: ${JWT_ACCESS_TOKEN_AUDIENCE}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_AUDIENCE: ${JWT_REFRESH_TOKEN_AUDIENCE}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    depends_on:
      local-postgres:
        condition: service_healthy
      local-redis:
        condition: service_healthy
    networks:
      - goormgb-network

  queue:
    build:
      context: ..
      dockerfile: Queue/Dockerfile
      args:
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/arm64}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
    container_name: queue
    environment:
      DB_URL: jdbc:postgresql://local-postgres:5432/goormgb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: queue-redis
      REDIS_PORT: 6379
      ADMISSION_PRIVATE_KEY: ${ADMISSION_PRIVATE_KEY}
      ADMISSION_PUBLIC_KEY: ${ADMISSION_PUBLIC_KEY}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
    depends_on:
      local-postgres:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
    networks:
      - goormgb-network

  seat:
    build:
      context: ..
      dockerfile: Seat/Dockerfile
      args:
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/arm64}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
    container_name: seat
    environment:
      DB_URL: jdbc:postgresql://local-postgres:5432/goormgb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: local-redis
      REDIS_PORT: 6379
      ADMISSION_PUBLIC_KEY: ${ADMISSION_PUBLIC_KEY}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: seat-service
      KAFKA_CONSUMER_KEY_DESERIALIZER: ${KAFKA_CONSUMER_KEY_DESERIALIZER}
      KAFKA_CONSUMER_VALUE_DESERIALIZER: ${KAFKA_CONSUMER_VALUE_DESERIALIZER}
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      KAFKA_CONSUMER_TRUSTED_PACKAGES: ${KAFKA_CONSUMER_TRUSTED_PACKAGES}
    depends_on:
      local-postgres:
        condition: service_healthy
      local-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - goormgb-network

  order-core:
    build:
      context: ..
      dockerfile: Order-Core/Dockerfile
      args:
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/arm64}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
    container_name: order-core
    environment:
      DB_URL: jdbc:postgresql://local-postgres:5432/goormgb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: local-redis
      REDIS_PORT: 6379
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PRODUCER_KEY_SERIALIZER: ${KAFKA_PRODUCER_KEY_SERIALIZER}
      KAFKA_PRODUCER_VALUE_SERIALIZER: ${KAFKA_PRODUCER_VALUE_SERIALIZER}
      KAFKA_PRODUCER_ACKS: ${KAFKA_PRODUCER_ACKS}
      KAFKA_CONSUMER_GROUP_ID: order-core-notification
      KAFKA_CONSUMER_KEY_DESERIALIZER: ${KAFKA_CONSUMER_KEY_DESERIALIZER}
      KAFKA_CONSUMER_VALUE_DESERIALIZER: ${KAFKA_CONSUMER_VALUE_DESERIALIZER}
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      KAFKA_CONSUMER_TRUSTED_PACKAGES: ${KAFKA_CONSUMER_TRUSTED_PACKAGES}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_PREFIX: ${S3_PREFIX}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    depends_on:
      local-postgres:
        condition: service_healthy
      local-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - goormgb-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: goormgb-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: goormgb
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - goormgb-network

volumes:
  postgres-data:
  kafka-data:

networks:
  goormgb-network:
    driver: bridge
