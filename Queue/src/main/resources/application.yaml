# 재배포 트리거
server:
  port: 8081
  servlet:
    context-path: /queue
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: queue
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  task:
    execution:
      pool:
        core-size: 8
        max-size: 50
        queue-capacity: 100

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

queue:
  ready-ttl-seconds: 60
  admission-ttl-seconds: 900
  expired-marker-ttl-seconds: 300
  promotion-batch-size: 100
  promotion-interval-ms: 1000
  active-match-key: queue:match
  wait-key-prefix: queue:wait
  ready-key-prefix: queue:ready
  expired-key-prefix: queue:expired
  ready-index-key-prefix: queue:ready:index
  polling:
    ready-ms: 1000
    fast-ms: 1500
    medium-ms: 3000
    slow-ms: 5000
    fast-rank-threshold: 100
    medium-rank-threshold: 1000

  security:
    jwt:
      private-key: ${ADMISSION_PRIVATE_KEY}
      public-key: ${ADMISSION_PUBLIC_KEY}
      issuer: queue-service

prequeue:
  booking-option-key-prefix: queue:precheck:booking-option

encryption:
  db-key: ${DB_ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  config: classpath:logback-spring.xml
