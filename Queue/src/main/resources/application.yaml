# 재배포 트리거
server:
  port: 8081
  servlet:
    context-path: /queue
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: queue
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  task:
    execution:
      pool:
        core-size: 8
        max-size: 50
        queue-capacity: 100

  # 캐시 인스턴스는 CacheConfig#cacheManager() 에서 캐시별 TTL/size 로 등록한다.
  cache:
    type: caffeine

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      leak-detection-threshold: 10000

# Read Replica 라우팅 (datasource.routing.enabled=true 시 spring.datasource 대신 사용)
datasource:
  routing:
    enabled: ${DB_ROUTING_ENABLED:false}
    primary:
      jdbc-url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
    replica:
      jdbc-url: ${DB_REPLICA_URL:${DB_URL}}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: ${DB_REPLICA_POOL_MAX:10}
      minimum-idle: ${DB_REPLICA_POOL_MIN_IDLE:3}
      connection-timeout: 30000
      read-only: true

  jpa:
    # OSIV 기본값(true) 은 컨트롤러 응답 종료 시점까지 DB 커넥션을 점유해
    # HikariCP 회전율을 절반 이하로 떨어뜨린다. 본 서비스는 JPA lazy 연관을
    # 컨트롤러 레이어에서 접근하지 않으므로 명시적으로 비활성화한다.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE:2}

queue:
  ready-ttl-seconds: 60
  admission-ttl-seconds: 900
  expired-marker-ttl-seconds: 300
  promotion-batch-size: 100
  promotion-interval-ms: 1000
  active-match-key: queue:match
  wait-key-prefix: queue:wait
  ready-key-prefix: queue:ready
  expired-key-prefix: queue:expired
  ready-index-key-prefix: queue:ready:index
  polling:
    ready-ms: 1000
    fast-ms: 1500
    medium-ms: 3000
    slow-ms: 5000
    fast-rank-threshold: 100
    medium-rank-threshold: 1000

  security:
    jwt:
      private-key: ${ADMISSION_PRIVATE_KEY}
      public-key: ${ADMISSION_PUBLIC_KEY}
      issuer: queue-service

prequeue:
  booking-option-key-prefix: queue:precheck:booking-option

encryption:
  db-key: ${DB_ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  config: classpath:logback-spring.xml
