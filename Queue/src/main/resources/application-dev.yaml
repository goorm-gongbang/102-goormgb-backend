server:
  port: 8081
  servlet:
    context-path: /queue

spring:
  application:
    name: queue
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER}
      value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER}
      acks: ${KAFKA_PRODUCER_ACKS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:queue-service}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      properties:
        spring.json.trusted.packages: ${KAFKA_CONSUMER_TRUSTED_PACKAGES}

queue:
  ready-ttl-seconds: 60
  admission-ttl-seconds: 900
  expired-marker-ttl-seconds: 300
  promotion-batch-size: 1000
  promotion-interval-ms: 1000
  active-match-key: queue:match
  wait-key-prefix: queue:wait
  ready-key-prefix: queue:ready
  expired-key-prefix: queue:expired
  ready-index-key-prefix: queue:ready:index
  polling:
    ready-ms: 1000
    fast-ms: 1500
    medium-ms: 3000
    slow-ms: 5000
    fast-rank-threshold: 100
    medium-rank-threshold: 1000

  security:
    jwt:
      private-key: ${ADMISSION_PRIVATE_KEY}
      public-key: ${ADMISSION_PUBLIC_KEY}
      issuer: queue-service


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.goormgb.be: DEBUG
    org.springframework.web: DEBUG
