server:
  port: 8081
  servlet:
    context-path: /queue

spring:
  application:
    name: queue
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

queue:
  ready-ttl-seconds: 90
  expired-marker-ttl-seconds: 300
  promotion-batch-size: 100
  promotion-interval-ms: 1000
  active-match-key: queue:match
  wait-key-prefix: queue:wait
  ready-key-prefix: queue:ready
  expired-key-prefix: queue:expired
  ready-index-key-prefix: queue:ready:index
  polling:
    ready-ms: 1000
    fast-ms: 1500
    medium-ms: 3000
    slow-ms: 5000
    fast-rank-threshold: 100
    medium-rank-threshold: 1000

  security:
    jwt:
      private-key: ${ADMISSION_PRIVATE_KEY}
      public-key: ${ADMISSION_PUBLIC_KEY}
      issuer: queue-service


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.goormgb.be: DEBUG
