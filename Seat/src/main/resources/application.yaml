server:
  port: 8082
  servlet:
    context-path: /seat

spring:
  application:
    name: seat
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

queue:
  preference-key-prefix: seat:preference

admission:
  jwt:
    public-key: ${ADMISSION_PUBLIC_KEY}
    issuer: ${JWT_ISSUER:goormgb-auth-service}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  endpoints:
    web:
      exposure:
        include: health
