server:
  port: 8082
  servlet:
    context-path: /seat

spring:
  application:
    name: seat
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER}
      value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER}
      acks: ${KAFKA_PRODUCER_ACKS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      properties:
        spring.json.trusted.packages: ${KAFKA_CONSUMER_TRUSTED_PACKAGES}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

booking:
  options-key-prefix: seat:booking-options
  options-ttl-seconds: 900

prequeue:
  redis:
    host: ${QUEUE_REDIS_HOST:${REDIS_HOST}}
    port: ${QUEUE_REDIS_PORT:${REDIS_PORT}}
  booking-option-key-prefix: queue:precheck:booking-option
  booking-option-ttl-seconds: ${booking.options-ttl-seconds}

admission:
  jwt:
    public-key: ${ADMISSION_PUBLIC_KEY}
    issuer: ${ADMISSION_JWT_ISSUER:queue-service}

encryption:
  db-key: ${DB_ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  config: classpath:logback-spring.xml
