server:
  port: 8082
  servlet:
    context-path: /seat

spring:
  application:
    name: seat
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

booking:
  options-key-prefix: seat:booking-options
  options-ttl-seconds: 900

admission:
  jwt:
    public-key: ${ADMISSION_PUBLIC_KEY}
    issuer: ${ADMISSION_JWT_ISSUER:queue-service}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  config: classpath:logback-spring.xml
