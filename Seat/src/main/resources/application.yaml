server:
  port: 8082
  servlet:
    context-path: /seat
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: seat
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  task:
    execution:
      pool:
        core-size: 8
        max-size: 50
        queue-capacity: 100

  # 캐시 인스턴스는 CacheConfig#cacheManager() 에서 캐시별 TTL/size 로 등록한다.
  cache:
    type: caffeine

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:20}
      connection-timeout: 30000
      leak-detection-threshold: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER}
      value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER}
      acks: ${KAFKA_PRODUCER_ACKS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      properties:
        spring.json.trusted.packages: ${KAFKA_CONSUMER_TRUSTED_PACKAGES}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

booking:
  options-key-prefix: seat:booking-options
  options-ttl-seconds: 900

prequeue:
  redis:
    host: ${REDIS_QUEUE_HOST}
    port: ${REDIS_QUEUE_PORT}
  booking-option-key-prefix: queue:precheck:booking-option
  booking-option-ttl-seconds: ${booking.options-ttl-seconds}

admission:
  jwt:
    public-key: ${ADMISSION_PUBLIC_KEY}
    issuer: ${ADMISSION_JWT_ISSUER:queue-service}

encryption:
  db-key: ${DB_ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  config: classpath:logback-spring.xml
