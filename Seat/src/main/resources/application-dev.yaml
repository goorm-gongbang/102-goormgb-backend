server:
  port: 8082
  servlet:
    context-path: /seat

spring:
  application:
    name: seat
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

booking:
  options-key-prefix: seat:booking-options
  options-ttl-seconds: 900

admission:
  jwt:
    public-key: ${ADMISSION_PUBLIC_KEY}
    issuer: ${ADMISSION_TOKEN_ISSUER:queue-service}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.goormgb.be: DEBUG
