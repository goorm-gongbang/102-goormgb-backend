server:
  port: 8082
  servlet:
    context-path: /seat

spring:
  application:
    name: seat
  jackson:
    time-zone: UTC
    data-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time-zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      properties:
        spring.json.trusted.packages: ${KAFKA_CONSUMER_TRUSTED_PACKAGES}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

booking:
  options-key-prefix: seat:booking-options
  options-ttl-seconds: 900

prequeue:
  redis:
    host: ${QUEUE_REDIS_HOST:${REDIS_HOST}}
    port: ${QUEUE_REDIS_PORT:${REDIS_PORT}}
  booking-option-key-prefix: queue:precheck:booking-option
  booking-option-ttl-seconds: ${booking.options-ttl-seconds}

admission:
  jwt:
    public-key: ${ADMISSION_PUBLIC_KEY}
    issuer: ${ADMISSION_JWT_ISSUER:queue-service}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.goormgb.be: DEBUG
    org.springframework.web: DEBUG
